<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>專案管理系統 - 執行儀表板</title>
    <link rel="stylesheet" href="assets/common.css">
    <style>
        .project-card { background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.06); padding: 24px; margin-bottom: 25px; border: 1px solid var(--c-border); }

        /* 1. 實施前後對比圖 (4:3) */
        .media-banner { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 22px; }
        .media-box { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden; background: #edf2f7; border: 2px dashed #cbd5e0; cursor: pointer; transition: all .25s; }
        .media-box:hover { border-color: var(--c-primary); box-shadow: 0 4px 12px rgba(49,130,206,.15); }
        .media-box img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; display: block; }
        .media-box .no-img { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #a0aec0; font-size: 13px; font-weight: 600; }
        .upload-overlay { position: absolute; inset: 0; background: rgba(15,23,42,.55); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .2s; z-index: 3; gap: 6px; }
        .upload-overlay .icon { font-size: 26px; }
        .media-box:hover .upload-overlay { opacity: 1; }
        .media-tag { position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; color: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.25); z-index: 4; }
        .tag-before { background: #e53e3e; }
        .tag-after { background: var(--c-primary); }
        .media-desc { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,.8)); color: #fff; padding: 14px 40px 10px 14px; font-size: 12px; z-index: 4; }
        .btn-edit-desc { position: absolute; right: 8px; bottom: 8px; z-index: 5; background: rgba(255,255,255,.9); border: none; border-radius: 4px; font-size: 12px; padding: 3px 7px; cursor: pointer; }

        /* 2. 標頭 */
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #edf2f7; padding-bottom: 16px; margin-bottom: 16px; gap: 16px; flex-wrap: wrap; }
        .card-title-group h2 { margin: 6px 0; font-size: 20px; color: #1a365d; }
        .card-meta { font-size: 13px; color: var(--c-muted); display: flex; gap: 14px; flex-wrap: wrap; }
        .card-meta strong { color: #4a5568; }
        .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .pm-badge { background: #ebf8ff; color: var(--c-primary-dark); border: 1px solid #bee3f8; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; }
        .overall { font-size: 12px; color: var(--c-muted); width: 200px; }

        /* 3. 甘特圖 */
        .gantt-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11.5px; color: var(--c-muted); margin-bottom: 8px; }
        .gantt-legend b { color: #2d3748; }
        .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
        .gantt-scroll { overflow-x: auto; margin-bottom: 20px; }
        .gantt-container { border: 1px solid var(--c-border); border-radius: 8px; background: #fff; position: relative; min-width: 760px; }
        .timeline-header { display: flex; border-bottom: 1px solid var(--c-border); }
        .task-list-header { width: 250px; flex-shrink: 0; padding: 12px 16px; font-weight: 700; font-size: 13px; border-right: 1px solid var(--c-border); background: #f8fafc; }
        .timeline-axis { flex-grow: 1; position: relative; height: 48px; background: #f8fafc; }
        .axis-zone { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--c-muted); background: #edf2f7; overflow: hidden; white-space: nowrap; }
        .week-col { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--c-border); display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 11px; color: var(--c-muted); overflow: hidden; }
        .week-title { font-weight: 700; color: #2d3748; }

        .gantt-body { position: relative; }
        .grid-layer { position: absolute; top: 0; bottom: 0; left: 250px; right: 0; pointer-events: none; }
        .grid-zone { position: absolute; top: 0; bottom: 0; background: rgba(237,242,247,.45); }
        .grid-line { position: absolute; top: 0; bottom: 0; border-left: 1px solid #edf2f7; }
        .today-line { position: absolute; top: 0; bottom: 0; border-left: 2px solid #e53e3e; z-index: 3; }
        .today-line span { position: absolute; top: 2px; left: 3px; font-size: 10px; font-weight: 700; color: #e53e3e; background: #fff; padding: 0 3px; border-radius: 3px; white-space: nowrap; }

        .task-row { display: flex; border-bottom: 1px solid #edf2f7; position: relative; }
        .task-row:hover { background: rgba(247,250,252,.7); }
        .task-info { width: 250px; flex-shrink: 0; padding: 9px 12px; border-right: 1px solid var(--c-border); display: flex; justify-content: space-between; align-items: center; background: #fff; position: relative; z-index: 4; }
        .task-title-wrap { flex-grow: 1; overflow: hidden; }
        .task-name { font-size: 13px; font-weight: 700; display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .task-name.clickable { cursor: pointer; }
        .toggle-btn { margin-right: 6px; font-family: monospace; font-size: 13px; color: var(--c-primary); font-weight: bold; flex-shrink: 0; }
        .task-owner-sub { font-size: 11px; color: var(--c-muted); margin-left: 22px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-hide-row { background: transparent; border: none; color: #a0aec0; font-size: 13px; cursor: pointer; padding: 2px 6px; border-radius: 4px; opacity: 0; transition: all .2s; flex-shrink: 0; }
        .task-row:hover .btn-hide-row { opacity: 1; }
        .btn-hide-row:hover { color: #e53e3e; background: #fed7d7; }

        .task-bar-area { flex-grow: 1; position: relative; min-height: 38px; }
        .bar { position: absolute; top: 50%; transform: translateY(-50%); height: 18px; border-radius: 4px; display: flex; align-items: center; padding-left: 6px; font-size: 10px; color: #fff; font-weight: 700; z-index: 2; white-space: nowrap; overflow: visible; background: var(--c-primary); }
        .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(0,0,0,.18); border-radius: 4px 0 0 4px; }
        .bar .lbl { position: relative; }
        .bar .lbl-out { position: absolute; left: calc(100% + 5px); color: #2d3748; }
        .bar.sub { height: 14px; }
        .bar.done { background: #38a169; }
        .bar.delay { background: #dd6b20; }
        .bar.stop { background: #a0aec0; }

        .subtasks-panel { display: none; background: #f8fafc; }
        .subtasks-panel.open { display: block; }
        .subtasks-panel .task-info { padding-left: 28px; border-left: 3px solid #63b3ed; background: #f8fafc; }
        .subtasks-panel .task-name { font-weight: 500; font-size: 12px; }

        .task-list-footer { display: flex; align-items: center; background: #f8fafc; position: relative; z-index: 5; border-radius: 0 0 8px 8px; }
        .footer-btn-area { width: 250px; flex-shrink: 0; padding: 8px 12px; border-right: 1px solid var(--c-border); }
        .footer-summary { padding: 0 14px; font-size: 12px; }
        .btn-add-module-filter { background: #ebf8ff; color: var(--c-primary-dark); border: 1px dashed #63b3ed; border-radius: 6px; padding: 7px 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; width: 100%; font-family: inherit; }
        .btn-add-module-filter:hover { background: #bee3f8; }
        body.readonly .footer-btn-area { display: none; }
        .link-btn { background: none; border: none; color: var(--c-primary); cursor: pointer; font-size: 12px; font-weight: 600; padding: 0 2px; font-family: inherit; }
        .link-btn:hover { text-decoration: underline; }
        .hidden-note .task-info { padding: 6px 12px 6px 28px; justify-content: flex-start; gap: 8px; }
        .hidden-note .task-bar-area { min-height: 28px; }

        /* 甘特圖顯示設定選擇器（position: fixed，避免被甘特圖橫向捲動區裁切） */
        .gantt-picker { display: none; position: fixed; z-index: 1500; background: #fff; border: 1px solid #cbd5e0; border-radius: 10px; box-shadow: 0 14px 34px rgba(0,0,0,.22); flex-direction: column; overflow: hidden; }
        .gantt-picker.open { display: flex; }
        .pk-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 14px 8px; font-size: 13px; }
        .pk-close { background: none; border: none; font-size: 15px; color: #a0aec0; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
        .pk-close:hover { background: #edf2f7; color: #2d3748; }
        .pk-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; border-bottom: 1px solid #edf2f7; }
        .pk-actions button { background: #f7fafc; border: 1px solid #cbd5e0; border-radius: 5px; font-size: 11.5px; font-weight: 600; padding: 4px 8px; cursor: pointer; color: #4a5568; font-family: inherit; }
        .pk-actions button:hover { background: #ebf8ff; border-color: #90cdf4; color: var(--c-primary-dark); }
        .pk-list { overflow-y: auto; padding: 6px 8px; flex: 1; min-height: 80px; }
        .pk-mod { border-radius: 6px; }
        .pk-mod + .pk-mod { border-top: 1px dashed #edf2f7; }
        .pk-mod-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 6px; }
        .pk-check { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 12.5px; color: #2d3748; min-width: 0; flex: 1; }
        .pk-check input { width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; }
        .pk-mod-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pk-sub-toggle { background: #edf2f7; border: none; border-radius: 10px; font-size: 11px; font-weight: 700; color: #4a5568; padding: 3px 9px; cursor: pointer; white-space: nowrap; font-family: inherit; }
        .pk-sub-toggle:hover { background: #bee3f8; color: var(--c-primary-dark); }
        .pk-tasks { padding: 2px 6px 8px 30px; display: flex; flex-direction: column; gap: 6px; }
        .pk-task { font-size: 12px; color: #4a5568; }
        .pk-task span:first-of-type { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pk-prog { font-size: 11px; color: #a0aec0; font-family: monospace; }
        .pk-hint { font-size: 11px; color: #a0aec0; }
        .pk-foot { padding: 8px 14px; border-top: 1px solid #edf2f7; font-size: 11.5px; background: #fafafa; }

        /* 4. 最新執行進度 */
        .progress-logs { background: #f8fafc; border-radius: 8px; border: 1px solid var(--c-border); padding: 18px 20px; }
        .logs-header { font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .logs-header > span::before { content: ""; display: inline-block; width: 4px; height: 14px; background: var(--c-primary); margin-right: 8px; border-radius: 2px; vertical-align: -2px; }
        .logs-header a { font-size: 12px; color: var(--c-primary); text-decoration: none; font-weight: 600; }
        .logs-list { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
        .log-item { display: flex; align-items: flex-start; gap: 10px; font-size: 12.5px; line-height: 1.5; color: #4a5568; }
        .log-date { font-family: monospace; font-weight: 700; color: var(--c-muted); width: 86px; flex-shrink: 0; }
        .log-mod { color: #a0aec0; font-size: 11.5px; }
        .btn-add-log { width: 100%; background: #fff; border: 1px dashed #cbd5e0; border-radius: 6px; padding: 8px; font-size: 12.5px; font-weight: 700; color: #4a5568; cursor: pointer; }
        .btn-add-log:hover { border-color: var(--c-primary); color: var(--c-primary); background: #ebf8ff; }

        .not-owner .owner-only { display: none !important; }
        .not-owner .media-box { cursor: default; }
        .log-item { flex-wrap: wrap; }
        .log-item > span[style*="flex:1"] { flex: 1 1 260px !important; min-width: 0; }
        .log-item .author-tag { margin-left: 6px; }
        .btn-add-card { border: 2px dashed #cbd5e0; border-radius: 12px; height: 80px; display: flex; justify-content: center; align-items: center; cursor: pointer; color: var(--c-muted); font-weight: 700; font-size: 16px; background: transparent; width: 100%; }
        .btn-add-card:hover { border-color: var(--c-primary); color: var(--c-primary); background: #ebf8ff; }

        @media (max-width: 760px) { .media-banner { grid-template-columns: 1fr; } .header-right { align-items: flex-start; } }
    </style>
</head>

<script>
    const esc = PM.esc;
    let imgTarget = null;                // { pid, field }

    /* ---------- 甘特圖顯示狀態 ----------
       • 隱藏哪些大項目／細項：存在資料庫（projects.hidden_modules / hidden_tasks），全體成員共用
       • 哪些大項目「展開細項」：個人介面偏好，記在本機瀏覽器 */
    const EXP_KEY = 'pm_gantt_expanded';
    const expanded = new Set((() => { try { return JSON.parse(localStorage.getItem(EXP_KEY) || '[]'); } catch (e) { return []; } })());
    const saveExpanded = () => { try { localStorage.setItem(EXP_KEY, JSON.stringify([...expanded])); } catch (e) {} };
    const pending = {};                  // pid → { hm:Set, ht:Set }：已在畫面套用、尚在寫入資料庫的設定
    const saveTimers = {};
    let pickerPid = null;
    const pickerOpenMods = new Set();    // 選擇器中展開細項清單的大項目

    function vis(p) {
        return pending[p.id] || { hm: new Set(p.hiddenModules), ht: new Set(p.hiddenTasks || []) };
    }

    /* ================= 甘特圖時間軸 =================
       過去 15%｜近 8 週 70%｜未來 15% 的壓縮時間軸，依「今天」自動計算 */
    function buildScale(p) {
        const pS = PM.parseDate(p.start), pE = PM.parseDate(p.end);
        if (!pS || !pE || pE <= pS) return null;
        const DAY = 864e5, WEEK = 7 * DAY, WIN = 8 * WEEK;
        const now = PM.parseDate(PM.today());
        let wS, wE;
        if (pE - pS <= WIN) { wS = pS; wE = pE; }
        else {
            wS = new Date(Math.min(Math.max(now - WEEK, pS), pE - WIN));
            wE = new Date(+wS + WIN);
        }
        const segs = [[pS, wS, 15], [wS, wE, 70], [wE, pE, 15]].filter(s => s[1] > s[0]);
        const total = segs.reduce((a, s) => a + s[2], 0);
        let acc = 0;
        segs.forEach(s => { s[3] = acc; s[2] = s[2] / total * 100; acc += s[2]; });
        const pct = d => {
            d = +d;
            if (d <= +pS) return 0;
            if (d >= +pE) return 100;
            for (const [a, b, w, off] of segs) if (d <= +b) return off + (d - a) / (b - a) * w;
            return 100;
        };
        const weeks = [];
        for (let d = +wS, i = 1; d < +wE; d += WEEK, i++) {
            const end = Math.min(d + WEEK, +wE);
            weeks.push({ left: pct(d), width: pct(end) - pct(d), label: 'W' + i, date: (new Date(d).getMonth() + 1) + '/' + String(new Date(d).getDate()).padStart(2, '0') });
        }
        return { pct, weeks, pastW: pct(wS), futureL: pct(wE), now, pS, pE };
    }

    function barHtml(range, prog, scale, cls, delayed) {
        if (!range) return '<span class="muted" style="position:absolute;left:8px;top:11px;">尚未設定時程</span>';
        const s = PM.parseDate(range.start), e = PM.parseDate(range.end);
        if (!s || !e) return '';
        const left = scale.pct(s);
        const width = Math.max(scale.pct(new Date(+e + 864e5)) - left, 1.2);
        const color = prog >= 100 ? 'done' : (delayed ? 'delay' : '');
        const label = `${prog}%${delayed ? '（落後）' : ''}`;
        return `<div class="bar ${cls} ${color}" style="left:${left}%;width:${width}%;" title="${esc(range.start)} ~ ${esc(range.end)}｜${label}">
                    <div class="fill" style="width:${Math.min(prog, 100)}%"></div>
                    <span class="${width >= 9 ? 'lbl' : 'lbl-out'}">${label}</span></div>`;
    }

    function ganttHtml(p, settings) {
        const scale = buildScale(p);
        if (!scale) return `<div class="empty">專案起訖日期不正確，請至「編輯」修正後即可顯示甘特圖。</div>`;
        const { hm, ht } = vis(p);
        const nowStr = PM.today();
        let todayState = '';
        if (scale.now < scale.pS) todayState = `（距開工 ${PM.daysBetween(nowStr, p.start)} 天）`;
        else if (scale.now > scale.pE) todayState = '（已超過預計結束日）';

        const axis = `
            ${scale.pastW > 0 ? `<div class="axis-zone" style="left:0;width:${scale.pastW}%">過去 (壓縮)</div>` : ''}
            ${scale.weeks.map(w => `<div class="week-col" style="left:${w.left}%;width:${w.width}%"><div class="week-title">${w.label}</div>${w.date}</div>`).join('')}
            ${scale.futureL < 100 ? `<div class="axis-zone" style="left:${scale.futureL}%;width:${100 - scale.futureL}%">未來 (壓縮)</div>` : ''}`;
        const grid = `
            ${scale.pastW > 0 ? `<div class="grid-zone" style="left:0;width:${scale.pastW}%"></div>` : ''}
            ${scale.futureL < 100 ? `<div class="grid-zone" style="left:${scale.futureL}%;width:${100 - scale.futureL}%"></div>` : ''}
            ${scale.weeks.map(w => `<div class="grid-line" style="left:${w.left}%"></div>`).join('')}
            ${scale.now >= scale.pS && scale.now <= scale.pE ? `<div class="today-line" style="left:${scale.pct(scale.now)}%"><span>Today</span></div>` : ''}`;

        const pidE = esc(p.id);
        const rows = p.modules.filter(m => !hm.has(m.id)).map(m => {
            const key = p.id + '|' + m.id;
            const prog = PM.calcModuleProgress(m);          // 模塊進度一律以全部細項計算
            const delayed = settings.delayHighlight && m.subtasks.some(s => PM.isDelayed(s, settings));
            const shown = m.subtasks.filter(s => !ht.has(s.id));
            const hiddenN = m.subtasks.length - shown.length;
            const open = expanded.has(key) && m.subtasks.length;
            const subs = shown.map(s => {
                const d = settings.delayHighlight && PM.isDelayed(s, settings);
                return `<div class="task-row">
                    <div class="task-info"><div class="task-title-wrap">
                        <div class="task-name" title="${esc(s.name)}">${esc(s.name)}</div>
                        <div class="task-owner-sub" style="margin-left:0">${esc(s.pm || '-')} ／ 驗收：${esc(s.owner || '-')}</div>
                    </div>
                    <button type="button" class="btn-hide-row owner-only" onclick="setTaskVisible('${pidE}','${esc(m.id)}','${esc(s.id)}',false)" title="隱藏此細項（可於下方＋重新顯示）">✕</button></div>
                    <div class="task-bar-area">${barHtml({ start: s.start, end: s.end }, Number(s.progress) || 0, scale, 'sub', d)}</div>
                </div>`;
            }).join('') + (hiddenN ? `<div class="task-row hidden-note"><div class="task-info"><span class="muted">已隱藏 ${hiddenN} 項細項</span>
                    <button type="button" class="link-btn owner-only" onclick="openPicker(event,'${pidE}','${esc(m.id)}')">顯示…</button></div><div class="task-bar-area"></div></div>` : '');
            return `<div class="module-group">
                <div class="task-row">
                    <div class="task-info">
                        <div class="task-title-wrap">
                            <div class="task-name clickable" onclick="toggleTask('${esc(key)}','${pidE}')" title="${m.subtasks.length ? '點擊展開／收合細項' : '尚無細項'}">
                                <span class="toggle-btn">${m.subtasks.length ? (open ? '[-]' : '[+]') : '[ ]'}</span>${esc(m.name)}
                            </div>
                            <div class="task-owner-sub">Owner: ${esc(m.owner || '-')}｜細項 ${shown.length}${hiddenN ? '/' + m.subtasks.length : ''}</div>
                        </div>
                        <button type="button" class="btn-hide-row owner-only" onclick="setModuleVisible('${pidE}','${esc(m.id)}',false)" title="隱藏此大項目（可於下方＋重新顯示）">✕</button>
                    </div>
                    <div class="task-bar-area">${barHtml(PM.moduleRange(m), prog, scale, '', delayed)}</div>
                </div>
                <div class="subtasks-panel ${open ? 'open' : ''}">${subs}</div>
            </div>`;
        }).join('');

        const totalT = p.modules.reduce((n, m) => n + m.subtasks.length, 0);
        const shownM = p.modules.filter(m => !hm.has(m.id)).length;
        const shownT = p.modules.filter(m => !hm.has(m.id)).reduce((n, m) => n + m.subtasks.filter(s => !ht.has(s.id)).length, 0);

        return `
        <div class="gantt-legend">
            <span>起始：<b>${esc(p.start)}</b></span><span>Today：<b style="color:#e53e3e">${nowStr}</b>${todayState}</span><span>結束：<b>${esc(p.end)}</b></span>
            <span><i class="legend-dot" style="background:#3182ce"></i>進行中</span>
            <span><i class="legend-dot" style="background:#38a169"></i>已完成</span>
            <span><i class="legend-dot" style="background:#dd6b20"></i>落後 ${settings.delayDays} 天以上</span>
        </div>
        <div class="gantt-scroll"><div class="gantt-container">
            <div class="timeline-header">
                <div class="task-list-header">驗收模塊與任務</div>
                <div class="timeline-axis">${axis}</div>
            </div>
            <div class="gantt-body">
                <div class="grid-layer">${grid}</div>
                ${rows || `<div class="empty" style="position:relative;z-index:4">${p.modules.length ? '所有大項目皆已隱藏，請點下方「＋ 選擇顯示大項目／細項」' : '此專案尚未建立大項目，請至「編輯任務」新增'}</div>`}
                <div class="task-list-footer">
                    <div class="footer-btn-area">
                        <button type="button" class="btn-add-module-filter owner-only" id="pkbtn_${pidE}" onclick="openPicker(event,'${pidE}')">＋ 選擇顯示大項目／細項</button>
                    </div>
                    <div class="footer-summary muted">顯示大項目 ${shownM}/${p.modules.length}、細項 ${shownT}/${totalT}
                        ${p.modules.length ? `｜<button type="button" class="link-btn" onclick="expandAll('${pidE}',true)">全部展開</button>
                        <button type="button" class="link-btn" onclick="expandAll('${pidE}',false)">全部收合</button>` : ''}</div>
                </div>
            </div>
        </div></div>`;
    }

    function mediaBox(p, field, label, cls) {
        const src = field === 'before' ? p.imgBeforeUrl : p.imgAfterUrl;
        const desc = field === 'before' ? p.descBefore : p.descAfter;
        return `<div class="media-box" onclick="pickImage('${esc(p.id)}','${field}')" title="${PM.canEdit ? `點擊更換「${label}」圖片` : label}">
            <span class="media-tag ${cls}">${label}</span>
            ${src ? `<img src="${esc(src)}" alt="${label}" loading="lazy" onerror="this.remove()">` : ''}
            <div class="no-img">📷 ${PM.canEdit ? `點擊上傳${label}照片 (4:3)` : '尚無照片'}</div>
            <div class="upload-overlay owner-only"><span class="icon">📷</span><span>點擊更換圖片 (4:3)</span></div>
            <div class="media-desc">${esc(desc || '（尚未填寫說明）')}</div>
            <button type="button" class="btn-edit-desc owner-only" onclick="event.stopPropagation(); editDesc('${esc(p.id)}','${field}')">✎ 說明</button>
        </div>`;
    }

    function cardHtml(p, settings) {
        const logs = p.records.slice(0, 5);
        const stale = PM.staleDays(p);
        const own = PM.isOwner(p);
        return `<div class="project-card ${own ? '' : 'not-owner'}" id="${esc(p.id)}">
            <div class="media-banner">
                ${mediaBox(p, 'before', '實施前：現場舊況', 'tag-before')}
                ${mediaBox(p, 'after', '實施後：規劃目標', 'tag-after')}
            </div>
            <div class="card-header">
                <div class="card-title-group">
                    <div>${PM.typeTag(p.type)} <span class="badge-factory">${esc(p.factory)}</span> ${PM.statusBadge(p.status)}
                        ${stale ? `<span class="warn-text">⚠ 履歷已 ${stale} 天未更新</span>` : ''}</div>
                    <h2>${esc(p.name)}</h2>
                    <div style="margin-bottom:4px">${PM.ownerBadge(p)}</div>
                    <div class="card-meta"><span>專案 Owner：<strong>${esc(p.owner)}</strong></span><span>期程：<strong class="mono">${esc(p.start)} ~ ${esc(p.end)}</strong></span></div>
                </div>
                <div class="header-right">
                    <div class="pm-badge">專案負責人：${esc(p.pm || '-')}</div>
                    <div class="overall">總進度 <strong>${p.progress}%</strong>
                        <div class="progress-track"><div class="progress-fill ${p.progress >= 100 ? 'done' : ''}" style="width:${p.progress}%"></div></div></div>
                    <div>
                        <a class="btn-action owner-only" href="create_project.html?id=${encodeURIComponent(p.id)}">✏️ 編輯任務／進度</a>
                        ${own ? `<button type="button" class="btn-action btn-blue" onclick="PM.shareDialog('project','${esc(p.id)}',renderAll)">🔗 分享${p.shares.length ? `（${p.shares.length}）` : ''}</button>` : ''}
                        <a class="btn-action" href="project_list.html?open=${encodeURIComponent(p.id)}">📋 完整履歷</a>
                    </div>
                </div>
            </div>
            <div class="gantt-wrap" id="gw_${esc(p.id)}">${ganttHtml(p, settings)}</div>
            <div class="progress-logs">
                <div class="logs-header"><span>最新執行進度與重要動態（最新 5 筆，共 ${p.records.length} 筆）</span></div>
                <ul class="logs-list">
                    ${logs.length ? logs.map(r => `<li class="log-item">
                        <span class="log-date">${esc(r.date)}</span>${PM.recTag(r.type)}
                        <span style="flex:1">${esc(r.detail)} ${r.targetModule ? `<span class="log-mod">｜${esc(r.targetModule)}</span>` : ''}</span>
                        ${PM.authorLine(r)}
                        ${PM.isAuthor(r) ? `<span class="entry-actions"><button type="button" class="btn-mini" title="修改這筆紀錄" onclick="openLogModal('${esc(p.id)}','${esc(r.id)}')">✎</button></span>` : ''}</li>`).join('')
                    : '<li class="muted">尚無執行紀錄</li>'}
                </ul>
                ${!own && PM.canTrack(p) ? '<div class="readonly-note" style="margin-bottom:8px">此專案由他人擁有：你可以查看並新增追蹤紀錄，專案內容與進度只有擁有者能修改。</div>' : ''}
                <button type="button" class="btn-add-log edit-only" onclick="openLogModal('${esc(p.id)}')">＋ 新增會議記錄 / 執行動態</button>
            </div>
        </div>`;
    }

    function renderAll() {
        const settings = PM.getSettings();
        const sf = document.getElementById('statusFilter').value;
        const ff = document.getElementById('factoryFilter').value;
        const scope = document.getElementById('scopeFilter').value;
        const list = PM.getProjects().filter(p =>
            (sf === 'active' ? (p.status === '進行中' || p.status === '評估中') : (!sf || p.status === sf)) &&
            (!ff || p.factory === ff) && (!scope ? p.isMine || PM.isSharedToMe(p) : PM.scopeOf(p) === scope));
        document.getElementById('projectCards').innerHTML = list.length ? list.map(p => cardHtml(p, settings)).join('')
            : `<div class="card empty">目前沒有符合條件的專案。可調整上方篩選，或點下方「＋ 新增專案」建立你自己的專案。</div>`;
    }

    /* ================= 甘特圖：展開／顯示設定 ================= */
    function rerenderGantt(pid) {
        const p = PM.getProject(pid);
        const el = document.getElementById('gw_' + pid);
        if (p && el) el.innerHTML = ganttHtml(p, PM.getSettings());
    }

    function toggleTask(key, pid) {
        expanded.has(key) ? expanded.delete(key) : expanded.add(key);
        saveExpanded();
        rerenderGantt(pid);
    }
    function expandAll(pid, open) {
        PM.getProject(pid).modules.forEach(m => { const k = pid + '|' + m.id; open ? expanded.add(k) : expanded.delete(k); });
        saveExpanded();
        rerenderGantt(pid);
        if (pickerPid === pid) renderPicker();
    }

    // 立即更新畫面，0.7 秒內的連續勾選合併成一次寫入資料庫
    function applyVis(pid, fn) {
        const p = PM.getProject(pid);
        const v = vis(p);
        const next = { hm: new Set(v.hm), ht: new Set(v.ht) };
        fn(next, p);
        pending[pid] = next;
        rerenderGantt(pid);
        if (pickerPid === pid) renderPicker();
        clearTimeout(saveTimers[pid]);
        saveTimers[pid] = setTimeout(() => flushVis(pid), 700);
    }
    async function flushVis(pid) {
        const v = pending[pid];
        if (!v) return;
        try {
            await PM.api.patchProject(pid, { hiddenModules: [...v.hm], hiddenTasks: [...v.ht] });
            await PM.reload();
            if (pending[pid] === v) delete pending[pid];
            PM.toast('顯示設定已儲存');
        } catch (e) {
            delete pending[pid];
            PM.toast('顯示設定儲存失敗：' + PM.errMsg(e), true);
            try { await PM.reload(); } catch (_) {}
        }
        rerenderGantt(pid);
        if (pickerPid === pid) renderPicker();
    }

    function setModuleVisible(pid, mid, visible) {
        applyVis(pid, (v, p) => {
            if (visible) {
                v.hm.delete(mid);
                const m = p.modules.find(x => x.id === mid);
                if (m && m.subtasks.length && m.subtasks.every(s => v.ht.has(s.id))) m.subtasks.forEach(s => v.ht.delete(s.id));
            } else v.hm.add(mid);
        });
    }
    function setTaskVisible(pid, mid, tid, visible) {
        applyVis(pid, v => {
            if (visible) {
                v.ht.delete(tid);
                v.hm.delete(mid);
                expanded.add(pid + '|' + mid);      // 新增顯示的細項自動展開，馬上看得到
                saveExpanded();
            } else v.ht.add(tid);
        });
    }
    function setAllVisible(pid, visible) {
        applyVis(pid, (v, p) => {
            if (visible) { v.hm.clear(); v.ht.clear(); }
            else p.modules.forEach(m => v.hm.add(m.id));
        });
    }

    /* ---------- 選擇器（固定定位，不會被甘特圖捲動區裁切） ---------- */
    function pickerEl() {
        let el = document.getElementById('ganttPicker');
        if (!el) {
            el = document.createElement('div');
            el.id = 'ganttPicker';
            el.className = 'gantt-picker';
            el.addEventListener('click', e => e.stopPropagation());
            el.addEventListener('change', e => {
                const t = e.target;
                if (t.dataset.act === 'mod') setModuleVisible(pickerPid, t.dataset.mid, t.checked);
                if (t.dataset.act === 'task') setTaskVisible(pickerPid, t.dataset.mid, t.dataset.tid, t.checked);
            });
            el.addEventListener('click', e => {
                const b = e.target.closest('[data-act]');
                if (!b || b.tagName === 'INPUT') return;
                const a = b.dataset.act;
                if (a === 'close') closePicker();
                if (a === 'all-on') setAllVisible(pickerPid, true);
                if (a === 'all-off') setAllVisible(pickerPid, false);
                if (a === 'exp-all') expandAll(pickerPid, true);
                if (a === 'col-all') expandAll(pickerPid, false);
                if (a === 'list') { pickerOpenMods.has(b.dataset.mid) ? pickerOpenMods.delete(b.dataset.mid) : pickerOpenMods.add(b.dataset.mid); renderPicker(); }
            });
            document.body.appendChild(el);
        }
        return el;
    }

    let pickerAnchor = null;
    function openPicker(e, pid, focusMid) {
        e.stopPropagation();
        pickerAnchor = e.currentTarget || e.target;
        const el = pickerEl();
        if (pickerPid === pid && el.classList.contains('open') && !focusMid) { closePicker(); return; }
        pickerPid = pid;
        if (focusMid) pickerOpenMods.add(focusMid);
        renderPicker();
        el.classList.add('open');
        positionPicker();
        if (focusMid) el.querySelector(`[data-mod-row="${CSS.escape(focusMid)}"]`)?.scrollIntoView({ block: 'nearest' });
    }
    function closePicker() {
        pickerPid = null;
        document.getElementById('ganttPicker')?.classList.remove('open');
    }
    function positionPicker() {
        const el = document.getElementById('ganttPicker');
        const btn = (pickerAnchor && pickerAnchor.isConnected) ? pickerAnchor : document.getElementById('pkbtn_' + pickerPid);
        if (!el || !btn || !el.classList.contains('open')) return;
        const raw = btn.getBoundingClientRect();
        const top = Math.min(Math.max(raw.top, 0), window.innerHeight), bottom = Math.min(Math.max(raw.bottom, 0), window.innerHeight);
        const r = { left: raw.left, top, bottom };
        const w = Math.min(380, window.innerWidth - 24);
        el.style.width = w + 'px';
        el.style.left = Math.max(12, Math.min(r.left, window.innerWidth - w - 12)) + 'px';
        const below = window.innerHeight - r.bottom, above = r.top;
        if (below >= 320 || below >= above) {
            el.style.top = (r.bottom + 6) + 'px'; el.style.bottom = 'auto';
            el.style.maxHeight = Math.max(200, below - 18) + 'px';
        } else {
            el.style.bottom = (window.innerHeight - r.top + 6) + 'px'; el.style.top = 'auto';
            el.style.maxHeight = Math.max(200, above - 18) + 'px';
        }
    }

    function renderPicker() {
        const el = pickerEl();
        const p = PM.getProject(pickerPid);
        if (!p) { closePicker(); return; }
        const { hm, ht } = vis(p);
        const listEl = el.querySelector('.pk-list');
        const scroll = listEl ? listEl.scrollTop : 0;
        const mods = p.modules.map(m => {
            const on = !hm.has(m.id);
            const shownT = m.subtasks.filter(s => !ht.has(s.id)).length;
            const partial = on && shownT > 0 && shownT < m.subtasks.length;
            const listOpen = pickerOpenMods.has(m.id);
            const key = p.id + '|' + m.id;
            return `<div class="pk-mod" data-mod-row="${esc(m.id)}">
                <div class="pk-mod-row">
                    <label class="pk-check"><input type="checkbox" data-act="mod" data-mid="${esc(m.id)}" ${on ? 'checked' : ''} ${partial ? 'data-partial="1"' : ''}>
                        <span class="pk-mod-name">${esc(m.name)}</span></label>
                    ${m.subtasks.length ? `<button type="button" class="pk-sub-toggle" data-act="list" data-mid="${esc(m.id)}">細項 ${on ? shownT : 0}/${m.subtasks.length} ${listOpen ? '▴' : '▾'}</button>` : '<span class="muted" style="font-size:11px">無細項</span>'}
                </div>
                ${listOpen ? `<div class="pk-tasks">${m.subtasks.map(s => `
                    <label class="pk-check pk-task"><input type="checkbox" data-act="task" data-mid="${esc(m.id)}" data-tid="${esc(s.id)}" ${on && !ht.has(s.id) ? 'checked' : ''}>
                        <span>${esc(s.name)}</span><span class="pk-prog">${Number(s.progress) || 0}%</span></label>`).join('')}
                    ${expanded.has(key) ? '' : '<div class="pk-hint">勾選細項後會自動在甘特圖展開</div>'}</div>` : ''}
            </div>`;
        }).join('');
        el.innerHTML = `
            <div class="pk-head"><div><b>甘特圖顯示設定</b><div class="muted" style="margin-top:2px">${esc(p.name)}</div></div>
                <button type="button" class="pk-close" data-act="close" title="關閉">✕</button></div>
            <div class="pk-actions">
                <button type="button" data-act="all-on">全部顯示</button><button type="button" data-act="all-off">全部隱藏</button>
                <button type="button" data-act="exp-all">全部展開細項</button><button type="button" data-act="col-all">全部收合</button>
            </div>
            <div class="pk-list">${mods || '<div class="muted" style="padding:12px">此專案尚無大項目</div>'}</div>
            <div class="pk-foot muted">${pending[p.id] ? '⏳ 儲存中…' : '✔ 設定會自動儲存，所有成員看到相同的顯示項目'}</div>`;
        el.querySelectorAll('input[data-partial]').forEach(i => { i.indeterminate = true; });
        const nl = el.querySelector('.pk-list');
        if (nl) nl.scrollTop = scroll;
    }

    document.addEventListener('click', () => { if (pickerPid) closePicker(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && pickerPid) closePicker(); });
    window.addEventListener('resize', positionPicker);
    document.querySelector('.main-wrapper').addEventListener('scroll', positionPicker, { passive: true });
    window.addEventListener('beforeunload', e => {
        if (Object.keys(pending).length) { Object.keys(pending).forEach(flushVis); e.preventDefault(); e.returnValue = ''; }
    });

    /* ================= 其他互動 ================= */
    function pickImage(pid, field) {
        if (!PM.isOwner(PM.getProject(pid))) return;
        imgTarget = { pid, field };
        const input = document.getElementById('imgInput');
        input.value = '';
        input.click();
    }
    document.getElementById('imgInput').addEventListener('change', async e => {
        const file = e.target.files[0];
        if (!file || !imgTarget) return;
        await PM.act(() => PM.api.uploadImage(imgTarget.pid, imgTarget.field, file), '照片已上傳到雲端');
        renderAll();
    });
    async function editDesc(pid, field) {
        const key = field === 'before' ? 'descBefore' : 'descAfter';
        const v = prompt('請輸入圖片說明文字：', PM.getProject(pid)[key] || '');
        if (v === null) return;
        await PM.act(() => PM.api.patchProject(pid, { [key]: v.trim() }), '說明已更新');
        renderAll();
    }

    // rid 有值＝修改自己寫的紀錄
    function openLogModal(pid, rid) {
        const p = PM.getProject(pid);
        const r = rid ? p.records.find(x => x.id === rid) : null;
        if (rid && !PM.isAuthor(r)) { alert('只有撰寫人可以修改這筆紀錄。'); return; }
        document.getElementById('logProjId').value = pid;
        document.getElementById('logEditId').value = r ? r.id : '';
        document.getElementById('logModalTitle').textContent = r ? '✏️ 修改會議記錄 / 執行進度' : '📝 新增會議記錄 / 執行進度';
        document.getElementById('logDate').value = r ? r.date : PM.today();
        PM.fillSelect('logType', PM.getDicts().recordTypes, r ? r.type : undefined);
        PM.fillSelect('logModule', ['全專案整體', ...p.modules.map(m => m.name)], r ? (r.targetModule || '全專案整體') : '全專案整體');
        PM.attendeeSelect('logInternal', '內部單位');
        PM.attendeeSelect('logExternal', '外部廠商');
        document.getElementById('logInternal').value = r ? r.internalAttendees : '';
        document.getElementById('logExternal').value = r ? r.externalAttendees : '';
        document.getElementById('logText').value = r ? r.detail : '';
        document.getElementById('logDelBtn').style.display = r ? '' : 'none';
        PM.openModal('logModal');
        document.getElementById('logText').focus();
    }
    async function saveNewLog() {
        const pid = document.getElementById('logProjId').value;
        const detail = document.getElementById('logText').value.trim();
        const date = document.getElementById('logDate').value;
        if (!date) { alert('請選擇日期！'); return; }
        if (!detail) { alert('請填寫會議記錄內容！'); return; }
        const editId = document.getElementById('logEditId').value;
        const rec = {
            date, detail,
            type: document.getElementById('logType').value,
            targetModule: document.getElementById('logModule').value,
            internalAttendees: document.getElementById('logInternal').value.trim(),
            externalAttendees: document.getElementById('logExternal').value.trim()
        };
        const ok = await PM.act(() => editId ? PM.api.updateRecord(editId, rec) : PM.api.addRecord(pid, rec), editId ? '紀錄已修改' : '紀錄已新增');
        if (ok) { PM.closeModal('logModal'); renderAll(); }
    }

    async function deleteLog() {
        const id = document.getElementById('logEditId').value;
        if (!id || !confirm('確定刪除這筆紀錄？')) return;
        if (await PM.act(() => PM.api.deleteRecord(id), '紀錄已刪除')) { PM.closeModal('logModal'); renderAll(); }
    }

    /* ================= 初始化 ================= */
    PM.boot('index', () => {
        PM.injectPeopleDatalist();
        const sf = document.getElementById('statusFilter');
        PM.PROJECT_STATUSES.forEach(s => sf.insertAdjacentHTML('beforeend', `<option value="${esc(s)}">${esc(s)}</option>`));
        PM.fillSelect('factoryFilter', PM.getDicts().factories, '', '全部廠區');
        PM.fillScope('scopeFilter');
        renderAll();
        if (location.hash) {
            const id = decodeURIComponent(location.hash.slice(1));
            if (!document.getElementById(id)) { sf.value = ''; if (PM.isAdmin && !document.getElementById(id)) document.getElementById('scopeFilter').value = ''; renderAll(); }
            if (!document.getElementById(id) && PM.isAdmin) { document.getElementById('scopeFilter').value = 'admin'; renderAll(); }
            document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
        }
    });
</script>
</body>
</html>
