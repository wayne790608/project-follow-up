<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登入 - 專案管理系統</title>
    <link rel="stylesheet" href="assets/common.css">
    <style>
        body { align-items: center; justify-content: center; background: linear-gradient(135deg, #1a202c 0%, #2b6cb0 100%); overflow: auto; }
        .login-card { background: #fff; border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.3); width: 380px; max-width: calc(100% - 32px); padding: 34px 32px; }
        .login-brand { font-size: 22px; font-weight: 800; color: #1a202c; margin-bottom: 4px; }
        .login-sub { font-size: 13px; color: var(--c-muted); margin-bottom: 22px; }
        .btn-block { width: 100%; padding: 11px; margin-top: 6px; }
        .msg { font-size: 13px; padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; display: none; line-height: 1.5; }
        .msg.show { display: block; }
        .msg.err { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
        .msg.ok { background: #f0fdf4; color: #22543d; border: 1px solid #9ae6b4; }
        .hint { font-size: 12px; color: var(--c-muted); margin-top: 16px; line-height: 1.6; border-top: 1px solid #edf2f7; padding-top: 12px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-brand">⚙️ 專案管理系統</div>
        <div class="login-sub">請輸入管理員發給你的帳號與密碼</div>

        <div class="msg" id="msg"></div>

        <form id="loginForm" autocomplete="on">
            <div class="form-group"><label>帳號</label><input type="text" id="loginUser" autocomplete="username" autocapitalize="off" spellcheck="false" required></div>
            <div class="form-group"><label>密碼</label><input type="password" id="loginPwd" autocomplete="current-password" required></div>
            <button class="btn btn-primary btn-block" type="submit">登入</button>
        </form>
        <div class="hint">沒有帳號或忘記密碼，請聯絡系統管理員（系統設定 → 帳號與權限）。<br>登入後可在左下角「🔑 修改密碼」自行更改密碼。</div>
    </div>

<script src="assets/vendor/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/offline-db.js"></script>
<script src="assets/common.js"></script>
<script>
    const $ = id => document.getElementById(id);
    const next = (() => {
        const n = PM.param('next') || 'index.html';
        return /^[\w\-]+\.html([?#].*)?$/.test(n) ? n : 'index.html';   // 只允許站內頁面，避免被導向外部網站
    })();

    function msg(text, ok) {
        const el = $('msg');
        el.textContent = text;
        el.className = 'msg show ' + (ok ? 'ok' : 'err');
    }
    function translate(e) {
        const m = (e && e.message) || String(e);
        if (/Invalid login credentials/i.test(m)) return '帳號或密碼錯誤';
        if (/rate limit|too many/i.test(m)) return '嘗試次數過多，請稍後再試';
        if (/Email not confirmed/i.test(m)) return '此帳號尚未啟用，請聯絡管理員';
        return m;
    }

    if (!PM.configured || !PM.sb) {
        msg('尚未設定資料庫連線：請編輯 assets/config.js 設定 OFFLINE: false 並填入 Supabase 的 URL 與 Publishable key（見部署手冊／README.md）。');
        document.querySelectorAll('form button').forEach(b => b.disabled = true);
    } else {
        if (PM.offline) msg('離線測試模式：不需登入，左下角可切換測試身分。即將進入系統…', true);
        PM.sb.auth.getSession().then(({ data }) => { if (data.session) location.replace(next); });

        $('loginForm').onsubmit = async e => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type=submit]');
            const username = $('loginUser').value.trim();
            if (!username) { msg('請輸入帳號'); return; }
            btn.disabled = true;
            try {
                const { error } = await PM.sb.auth.signInWithPassword({ email: PM.toLoginEmail(username), password: $('loginPwd').value });
                if (error) throw error;
                location.replace(next);
            } catch (err) { msg(translate(err)); }
            finally { btn.disabled = false; }
        };
    }
</script>
</body>
</html>
